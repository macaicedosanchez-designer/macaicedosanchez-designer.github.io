# ─────────────────────────────────────────────────────────────
# PÁGINA ESPECIAL HUGE (/hi-huge-team/)
#
# Cada bloque es una presentación. Las que tienen "destacada" salen
# arriba con su texto; TODAS salen en la galería, en este orden.
#
#   id        prefijo de las imágenes en el repositorio media:
#             <id>_deck_NN_pagina.jpg  (NN = número de diapositiva, 01, 02…)
#   paginas   cuántas diapositivas tiene
#   archivos  (en vez de id + paginas) lista exacta de imágenes, si tienen otro nombre
#   videos    diapositivas que se ven como video: <id>_deck_NN_animacion.mp4
#   portada   número de la diapositiva que va en la tarjeta de la galería
#   titulo / anio / cliente / porque   textos de la tarjeta (cliente: texto o { es, en } si lleva cargo)
#   destacada rótulo, texto (párrafos) y enlace opcional para la sección de arriba
# ─────────────────────────────────────────────────────────────

decks:
  - id: renobopr
    paginas: 62
    videos: [4, 5, 8, 27, 28]
    portada: 2
    anio: 2024
    cliente: { es: "Daniela Guzmán, subgerente de ejecución de proyectos", en: "Daniela Guzmán, Deputy Manager of Project Execution" }
    titulo: { es: "Bogotá's approach to urban renewal", en: "Bogotá's approach to urban renewal" }
    porque: { es: "Mi presentación más impactante: urbanismo, mercado inmobiliario y política pública explicados con diagramas y animaciones.", en: "My most striking presentation: urban planning, real estate and public policy explained through diagrams and animations." }
    destacada:
      rotulo: { es: "Mi presentación más impactante", en: "My most striking presentation" }
      texto:
        es:
          - "Convertí conceptos complejos de urbanismo, mercado inmobiliario y política pública en diagramas y animaciones claros y divertidos, para mostrarle a la Puerto Rico Builders Association cómo Bogotá renueva la ciudad, de la planeación a la ejecución."
        en:
          - "I turned complex concepts in urban planning, real estate and public policy into clear, playful diagrams and animations, to show the Puerto Rico Builders Association how Bogotá renews the city, from planning to execution."

  - id: renobokit
    archivos: [renobo_kitppt_01_portada.jpg, renobo_kitppt_02_ruta.jpg, renobo_kitppt_03_cronologia.jpg, renobo_kitppt_04_proceso.jpg, renobo_kitppt_05_gestiones.jpg, renobo_kitppt_06_convenio.jpg, renobo_kitppt_07_conceptos.jpg, renobo_kitppt_08_ejes-narrativos.jpg, renobo_kitppt_09_antes-despues.jpg, renobo_kitppt_10_iconos.jpg]
    portada: 1
    anio: 2025
    cliente: RenoBo
    titulo: { es: "Sistema de presentaciones RenoBo", en: "RenoBo presentation system" }
    porque: { es: "La plantilla más usada de RenoBo: toda la entidad la sigue usando para diagramar su trabajo.", en: "RenoBo's most used template: the whole organization still uses it to diagram its work." }
    destacada:
      rotulo: { es: "La más usada", en: "The most used one" }
      texto:
        es:
          - "La identidad de RenoBo está fijada por norma y no se podía cambiar: mi trabajo fue rediseñar cómo se aplica."
          - "Es mi favorita porque es la más usada: toda la organización la sigue usando hoy, no solo el equipo de comunicaciones. Incluye plantillas para diagramar rutas, cronologías, procesos, convenios y comparaciones."
          - "También diseñé un prompt para que cualquier persona convierta su contenido en diagramas del kit."
        en:
          - "RenoBo's identity is set by regulation and couldn't be changed: my job was to redesign how it's applied."
          - "It's my favorite because it's the most used: the whole organization still uses it today, not just the communications team. It includes templates to diagram routes, timelines, processes, agreements and comparisons."
          - "I also wrote a prompt so anyone can turn their content into kit diagrams."
      en_uso: [renobo_aplicacion_01_en-uso.jpg, renobo_aplicacion_02_en-uso.jpg, renobo_aplicacion_03_en-uso.jpg]
      enlace: { url: /direccion-creativa/renobo/, es: "Ver el caso completo de RenoBo →", en: "See the full RenoBo case →" }

  - id: progresourbano
    archivos: [progresourbano_kitppt_01_portada.jpg, progresourbano_sistema_01_web-y-apps.jpg, progresourbano_sistema_02_app-movil.jpg, progresourbano_kitppt_02_agenda.jpg, progresourbano_kitppt_03_separador.jpg, progresourbano_kitppt_04_tarjetas.jpg, progresourbano_kitppt_05_proceso.jpg, progresourbano_kitppt_06_ciclo.jpg, progresourbano_kitppt_07_matriz.jpg, progresourbano_kitppt_08_antes-despues.jpg, progresourbano_kitppt_09_cronograma.jpg, progresourbano_kitppt_10_cifras.jpg]
    portada: 1
    anio: 2026
    cliente: { es: "Claudia Niño, consultora privada", en: "Claudia Niño, independent consultant" }
    titulo: { es: "Progreso Urbano Consultores", en: "Progreso Urbano Consultores" }
    porque: { es: "Mi sistema de diseño más ordenado: una sola base para presentaciones, web y apps.", en: "My most organized design system: one foundation for slides, web and apps." }
    destacada:
      rotulo: { es: "Mi sistema de diseño más ordenado", en: "My most organized design system" }
      texto:
        es:
          - "Está hecha con un sistema de diseño pensado para web responsive: los mismos componentes, estilos y reglas funcionan en una presentación, en un sitio web y en la pantalla de un celular."
        en:
          - "It's built on a design system made for responsive web: the same components, styles and rules work on a slide, a website and a phone screen."
      enlace: { url: /direccion-creativa/progresourbano/, es: "Ver el caso completo →", en: "See the full case →" }

