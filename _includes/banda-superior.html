{%- comment -%} BANDA SUPERIOR: nombre (lleva al Home), selector ES/EN, LinkedIn y HV/CV. Igual en todas las páginas.
El resto de redes vive en el pie. {%- endcomment -%}
<header class="banda-superior">
  <div class="marco">
    <a class="nombre" href="/" data-evento="home">Martín Caicedo Sánchez</a>
    <nav class="menu" aria-label="Menú">
      <div class="selector-idioma" role="group" aria-label="Idioma / Language">
        <button type="button" data-idioma="es" aria-pressed="true" aria-label="Español" title="Español">ES</button>
        <button type="button" data-idioma="en" aria-pressed="false" aria-label="English" title="English">EN</button>
      </div>
      <a class="icono-social" style="--icono: url('{{ site.media_url }}/home_icono_04_linkedin.svg')"
         href="{{ site.data.links.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn" data-evento="linkedin"></a>
      <a class="link-hv" href="{{ site.docs_url }}{{ site.data.links.hv }}" target="_blank" rel="noopener" data-evento="hv" lang="es">HV</a>
      <a class="link-hv" href="{{ site.docs_url }}{{ site.data.links.cv }}" target="_blank" rel="noopener" data-evento="cv" lang="en">CV</a>
    </nav>
  </div>
</header>
